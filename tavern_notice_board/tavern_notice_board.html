<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavern Notice Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <img class="tavern-banner" src="images/tavern-sign.png"
            width="2172" height="724" fetchpriority="high">

        <div class="notice-form">
            <h2>Post a New Notice</h2>
            <form id="messageForm" novalidate>
                <div class="form-group">
                    <label for="author">Adventurer Name:</label>
                    <input type="text" id="author" placeholder="e.g. Sir Gareth" required>
                </div>
                <div class="form-group">
                    <label for="message">Notice Message:</label>
                    <textarea id="message" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit">Pin Message to Board</button>
                <p id="formError" role="status"></p>
            </form>
        </div>

        <div class="notices-heading">
            <img class="notice-illustration" src="images/notice-scroll.png">
            <h2 id="notices">Board Notices</h2>
        </div>
        <div id="messagesContainer">
            <p class="empty-msg">Loading notices...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
